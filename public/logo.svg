<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="200" cy="170" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo azul redondeado -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Brillo sutil arriba-izquierda -->
  <ellipse cx="160" cy="140" rx="200" ry="150" fill="white" fill-opacity="0.06"/>

  <!-- Engranaje naranja (8 dientes) centrado en la lupa -->
  <g transform="translate(214, 204)">
    <!-- Engranaje: polígono con 16 puntos alternando radio exterior/interior -->
    <polygon
      points="
        0,-88  23,-56  62,-62  56,-23
        88,0   56,23   62,62   23,56
        0,88  -23,56  -62,62  -56,23
       -88,0  -56,-23 -62,-62 -23,-56"
      fill="#f97316"
      filter="url(#glow)"/>
    <!-- Agujero del centro (mismo color que el fondo) -->
    <circle r="30" fill="#1e40af"/>
    <!-- Punto central -->
    <circle r="10" fill="#f97316" fill-opacity="0.6"/>
  </g>

  <!-- Lupa: aro blanco -->
  <circle cx="214" cy="204" r="138" stroke="white" stroke-width="42" fill="none"/>

  <!-- Lupa: mango diagonal blanco -->
  <line x1="322" y1="312" x2="430" y2="420"
        stroke="white" stroke-width="54" stroke-linecap="round"/>

  <!-- Detalle: pequeño arco naranja en el aro (acento de marca) -->
  <path d="M 214 66 A 138 138 0 0 1 311 93"
        stroke="#fb923c" stroke-width="42" stroke-linecap="round" fill="none"/>
</svg>
